<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="每日隨機名言佳句，給自己一點前進的力量。">
  <title>每日靈感｜隨機名言佳句</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="site-header">
      <div class="logo" aria-hidden="true">✦</div>
      <p class="eyebrow">A LITTLE DAILY INSPIRATION</p>
      <h1>每日靈感</h1>
      <p class="subtitle">給自己一點時間，讀一句話，找回前進的力量。</p>
    </header>

    <section class="quote-card" aria-live="polite">
      <div class="quote-mark" aria-hidden="true">“</div>
      <p id="quote" class="quote-text">正在為你尋找一句靈感……</p>
      <p id="author" class="quote-author"></p>
      <div class="card-footer">
        <span class="tag">今日的一點力量</span>
        <button id="refresh-btn" class="refresh-button" type="button">
          <span aria-hidden="true">↻</span> 換一句
        </button>
      </div>
    </section>

    <p id="status" class="status" role="status">正在連線取得名言……</p>
    <footer>資料來源：DummyJSON 公開 API · 使用 fetch / async / await</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
